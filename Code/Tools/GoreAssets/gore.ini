; Renegade gore settings. Copy next to Renegade.exe. All keys are optional; these are the defaults.
; Gore is cosmetic and single-player only. It never changes damage, AI or saves.

[Gore]
ChestWounds=1
ChestWoundRadius=0.024
; Procedural tissue craters and animated SoF2 bullet-wound decals.
HeadDestruction=1
AbdominalWounds=1
BodyWounds=1
HeadWoundRadius=0.018
AbdomenWoundRadius=0.026
BodyWoundRadius=0.045

Enabled=1                 ; 0 turns everything below off
Blood=1                   ; sprays on hits, splatter on walls behind, pools under bodies
CorpseDismemberment=1     ; bullets and explosions can remove remaining parts after death
Dismemberment=1           ; limbs come off; head decapitation only when HeadDestruction=0
Gibs=1                    ; the cut-off parts, chunks and organs fly and bounce
Player=0                  ; 1 = blood on your own soldier too (you are never dismembered)

HeadshotDecapChance=0.5   ; a killing head shot doing at least HeadshotDecapMinDamage
HeadshotDecapMinDamage=0  ; damage of the weapon's shot; raise to keep it to heavy weapons (sniper ~100)
LimbCutChance=0.5         ; a killing arm/leg shot doing at least LimbCutMinDamage
LimbCutMinDamage=0

ExplosionMinScale=0.35    ; how close (1 = point blank) an explosion must be to tear a body
ExplosionBurstScale=0.8   ; ... and to blow most of it apart

MaxGibs=48                ; flying pieces at once (the oldest disappears)
GibLifetime=45            ; seconds before a piece disappears
StumpBleedTime=6          ; seconds a stump pumps blood
BloodAmount=1.0           ; multiplies blood particles

; Kills by warheads whose name contains one of these get no gore (burning, tiberium...).
; Names come from Renegade's armor.ini; unconfirmed until checked in game.
NoGoreWarheads=FIRE,CHEM,ELECTRIC,TIBERIUM,LASER
