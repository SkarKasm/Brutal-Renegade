; Renegade VR settings. Copy next to Renegade.exe. All keys are optional; these are the defaults.
; Start the game with -vr. Without a headset, -vr VRSIM=tour runs a scripted test (see vrsim.h).

[VR]
EyeOffset=0.08,0,0.10
; Fraction of the headset's recommended per-eye resolution (0.25 - 2.0).
; Every eye is copied through the CPU for now, so keep this low.
RenderScale=0.7

; 0 = only your real head pitches/rolls the view (recommended).
; 1 = mouse/stick pitch also tilts the headset view.
FollowCameraPitch=0

; --- Movement ---
; 0 = snap turn, 1 = smooth turn (right stick left/right)
TurnMode=0
SnapTurnAngle=45
SmoothTurnSpeed=150
; 0 = walk where your head looks, 1 = where your left hand points
MoveRelativeTo=0

; --- Aiming ---
; 1 = aim with the right controller (the gun is in your hand), 0 = aim with the head/mouse
HandAim=1
; red beam from the gun to what it hits
LaserSight=1
; extra gun offset in the hand: forward, left, up (metres)
WeaponOffset=0,0,0

; --- EVA forearm computer: mission map, compass, health, armour and ammo ---
WristHUD=1
; Fallback centre when body IK is disabled; normal EVA mounting uses its authored forearm face
WristOffset=0.08,0.0,0.15
WristHeight=0.075
; from the controller grip back to the wrist joint of the arm model (metres)
WristBack=0.07
; turns the left arm model about the forearm (degrees)
ArmRoll=0

; --- Manual reload ---
; 1 = your weapons never reload themselves; shotgun supply inserts one shell
ManualReload=1
; A ejects; off-hand grip takes a chest-pouch magazine, insert at the gun
; 2 = simplified belt supply to the gun (also used for shell/cell/supply weapons)
; Off-hand trigger operates an empty firearm action; B releases the pistol slide
; Right stick up/down = jump/crouch; right grip + vertical stick = weapon selection
ReloadMode=3
; reach in metres around the animation-derived feed/action points
ReloadReach=0.20
; how far (metres) below your head the left hand must be to take a magazine
BeltDrop=0.45

; --- Simulator (VRSIM=) ---
SimEyeSize=960

; 1 = pull the empty pistol/sniper/auto-rifle action 6cm after inserting
ReloadAction=1

; Visible Havoc body and elbow/wrist joints, with matching rolled camo sleeves
BodyIK=1
WristMapRadius=25
